<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Z Product Compare</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="connection" id="connection" role="status">
    <strong>Z Product Compare</strong>
    <p id="connectionMessage">Could not connect to the local server. Run this command, then retry.</p>
    <code>hatch run review</code>
    <button id="retry" type="button">Retry</button>
  </main>
  <iframe
    id="review"
    title="Z Product Compare"
    allow="clipboard-write"
    hidden
  ></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
